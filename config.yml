model: omniroute/auto/best-reasoning
modelRoles:
  default: omniroute/auto/best-reasoning
  cheap: omniroute/auto/cheap
  fast: omniroute/auto/fast
  best: omniroute/auto/best-coding
  reasoning: omniroute/auto/best-reasoning
  review: omniroute/auto/pro-coding:high
  image: free-stack/vision
memory:
  backend: local
  summaryInjectionTokenLimit: 5000
compaction:
  enabled: true
  methodOrder:
    - remote
    - snapcompact
    - handoff
    - shake
    - soft
permissions:
  {}
symbolPreset: nerd
composer:
  shape: claude
theme:
  dark: titanium
  light: light
setupVersion: 2
# Extensions are copied to the active OMP agent directory by scripts/setup.sh.
# The installer writes absolute paths here because configured extension paths are
# resolved by the runtime loader and this repository is portable.
